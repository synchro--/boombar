name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Determine version
        id: version
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build universal app, DMG and ZIP
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: scripts/release.sh "$VERSION" --universal

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          assets=(
            "dist/BoomBar-$VERSION.dmg" "dist/BoomBar-$VERSION.zip"
            "dist/BoomBar.dmg" "dist/BoomBar.zip"
          )
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "${assets[@]}" --clobber
          else
            gh release create "v$VERSION" "${assets[@]}" \
              --title "Boom Bar $VERSION" --generate-notes
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BoomBar-${{ steps.version.outputs.value }}
          path: |
            dist/BoomBar-*.dmg
            dist/BoomBar-*.zip
